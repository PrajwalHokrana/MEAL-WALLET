<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Wallet — Counter Staff</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="/mess.html" class="brand">
      <span class="brand-badge">MW</span>
      <span>Meal Wallet <small style="font-weight: 500; color: var(--text-muted);">Counter Staff</small></span>
    </a>
    <div class="topbar-right">
      <span class="poll-indicator">
        <span class="poll-dot"></span>
        <span id="clockDisplay">-</span>
      </span>
      <button type="button" class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="container" style="max-width: 600px;">

    <div id="messAlertError"   class="alert alert-error"   role="alert"></div>
    <div id="messAlertSuccess" class="alert alert-success" role="status"></div>

    <section class="card" style="margin-top: 32px;">
      <div class="card-header">
        <div>
          <h2 class="card-title">Log Counter Attendance</h2>
          <p class="card-subtitle">
            Mark a student who was physically seen eating at the mess counter.
            If that student has an active skip request for the same meal, it will be flagged for Admin review.
          </p>
        </div>
      </div>

      <form id="attendanceForm">
        <label for="attStudentSelect">Student</label>
        <select id="attStudentSelect" required>
          <option value="">Loading students...</option>
        </select>

        <label for="attDateInput">Meal Date</label>
        <input type="date" id="attDateInput" required />

        <label for="attMealSelect">Meal</label>
        <select id="attMealSelect">
          <option value="BREAKFAST">BREAKFAST &nbsp;(08:00 AM)</option>
          <option value="LUNCH" selected>LUNCH &nbsp;(12:30 PM)</option>
          <option value="DINNER">DINNER &nbsp;(08:00 PM)</option>
        </select>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 6px;">
          Log Counter Presence
        </button>
      </form>
    </section>

  </main>

  <script>
    const token = localStorage.getItem('mw_token') || '';
    if (!token) window.location.href = '/';

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST', headers: { 'X-Session-Token': token } });
      localStorage.removeItem('mw_token');
      window.location.href = '/';
    });

    function showBanner(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 6000);
    }

    async function loadStudents() {
      try {
        const res = await fetch('/api/admin/skips?status=pending', {
          headers: { 'X-Session-Token': token }
        });
        if (res.status === 401 || res.status === 403) {
          localStorage.removeItem('mw_token');
          window.location.href = '/';
          return;
        }
        const data = await res.json();
        if (!data.ok) return;

        // Clock
        const clk = data.clock;
        document.getElementById('clockDisplay').textContent = clk.nowIstPretty;
        document.getElementById('attDateInput').value = clk.todayIstDate;

        // Students dropdown
        const students = data.students || [];
        const sel = document.getElementById('attStudentSelect');
        sel.innerHTML = students.length === 0
          ? '<option value="">No students enrolled</option>'
          : students.map(s => `<option value="${s.id}">${s.fullName} (${s.username} — Room ${s.roomNumber})</option>`).join('');
      } catch (_) {}
    }

    document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const studentId = document.getElementById('attStudentSelect').value;
      const mealDate  = document.getElementById('attDateInput').value;
      const mealType  = document.getElementById('attMealSelect').value;

      if (!studentId || !mealDate) {
        showBanner('messAlertError', 'Please select a student and meal date.');
        return;
      }

      try {
        const res = await fetch('/api/admin/attendance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Session-Token': token },
          body: JSON.stringify({ studentId, mealDate, mealType })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          showBanner('messAlertError', data.error || 'Failed to log attendance.');
          return;
        }
        showBanner('messAlertSuccess', 'Attendance logged successfully.');
        await loadStudents();
      } catch (_) {
        showBanner('messAlertError', 'Could not reach server.');
      }
    });

    loadStudents();
    setInterval(loadStudents, 10000);
  </script>
</body>
</html>
